name: Import reviewed launch classics
on:
  push:
    branches: [novalume-foundation]
    paths:
      - 'content/rights_manifest.json'
      - '.github/workflows/import-reviewed-launch.yml'
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Import missing, explicitly rights-reviewed books only
        run: |
          python3 - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          manifest=json.loads(Path('content/rights_manifest.json').read_text())
          for entry in manifest:
              if entry['rights']['decision']=='approved' and not Path('public/data/books', entry['id']+'.json').exists():
                  print('Importing',entry['id'],flush=True)
                  subprocess.run([sys.executable,'scripts/ingest_standardebooks.py',entry['id']],check=True)
          PY
      - run: npm test && npm run build
      - name: Commit tested, approved text and safe public catalogue
        run: |
          git config user.name 'novalume-catalog-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/books public/data/catalog.json public/data/story_index.json public/data/index_stats.json
          git diff --cached --quiet || (git commit -m 'catalog: import licensed full editions and rebuild safe indices' && git push)
