name: Import a rights-approved edition
on:
  workflow_dispatch:
    inputs:
      book_id:
        description: 'Exact approved book ID from content/rights_manifest.json'
        required: true
        type: string
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify rights gate and import original source
        run: python3 scripts/ingest_standardebooks.py '${{ inputs.book_id }}'
      - run: python3 scripts/build_catalog.py && python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit reviewed ingestion
        run: |
          git config user.name 'novalume-catalog-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/books public/data/catalog.json
          git diff --cached --quiet || (git commit -m "catalog: import rights-approved ${{ inputs.book_id }}" && git push)
